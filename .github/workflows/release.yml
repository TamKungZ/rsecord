name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and draft a release for (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Copy required VC++ DLLs
        shell: pwsh
        run: |
          $dlls = @('vcruntime140.dll', 'msvcp140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src -Destination target\release\ -Force
            } else {
              Write-Warning "DLL not found: $src"
            }
          }

      - run: choco install innosetup -y --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $iss = @'
          [Setup]
          AppId={{D8A7B2C1-3E4F-5A6B-7C8D-9E0F1A2B3C4D}
          AppName=rsecord
          AppVersion=APPVERSION
          AppPublisher=TamKungZ_
          DefaultDirName={autopf}\rsecord
          DefaultGroupName=rsecord
          OutputDir=dist
          OutputBaseFilename=rsecord-setup
          SetupIconFile=assets\icon.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\rsecord.exe
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog

          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; Flags: unchecked

          [Files]
          Source: "target\release\rsecord.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\vcruntime140.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\vcruntime140_1.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\msvcp140.dll"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\rsecord"; Filename: "{app}\rsecord.exe"
          Name: "{autodesktop}\rsecord"; Filename: "{app}\rsecord.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\rsecord.exe"; Description: "Launch rsecord"; Flags: nowait postinstall skipifsilent

          [InstallDelete]
          Type: files; Name: "{app}\*.dll"
          Type: files; Name: "{app}\rsecord.exe"
          '@
          $iss.Replace('APPVERSION', $ver) | Set-Content -Path installer.iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-windows
          path: dist/rsecord-setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang libclang-dev pkg-config ninja-build python3-pip \
            libasound2-dev libdbus-1-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgbm-dev
          pip3 install --user meson

      - name: Build PipeWire
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 --branch 1.4.2 https://gitlab.freedesktop.org/pipewire/pipewire.git
          cd pipewire
          meson setup build --prefix=$HOME/pipewire --libdir=lib --buildtype=release \
            -Dtests=disabled -Dexamples=disabled -Dman=disabled -Ddocs=disabled \
            "-Dsession-managers=[]"
          ninja -C build
          ninja -C build install
          echo "PKG_CONFIG_PATH=$HOME/pipewire/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/pipewire/lib" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist/rsecord
          cp target/release/rsecord dist/rsecord/
          cp assets/icon-256.png dist/rsecord/rsecord.png
          cat > dist/rsecord/rsecord.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=rsecord
          Comment=Lightweight screen recorder
          Exec=rsecord
          Icon=rsecord
          Categories=AudioVideo;Recorder;
          Terminal=false
          EOF
          tar -czf dist/rsecord-linux-x86_64.tar.gz -C dist rsecord

      - name: Build deb
        run: |
          set -e
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          DEB_ROOT=dist/deb-root
          mkdir -p "$DEB_ROOT/DEBIAN" \
                   "$DEB_ROOT/usr/bin" \
                   "$DEB_ROOT/usr/share/applications" \
                   "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp target/release/rsecord "$DEB_ROOT/usr/bin/rsecord"
          chmod +x "$DEB_ROOT/usr/bin/rsecord"
          cp assets/icon-256.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/rsecord.png"
          cat > "$DEB_ROOT/usr/share/applications/rsecord.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=rsecord
          Comment=Lightweight screen recorder
          Exec=/usr/bin/rsecord
          Icon=rsecord
          Categories=AudioVideo;Recorder;
          Terminal=false
          EOF
          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: rsecord
          Version: $VER
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libasound2, libdbus-1-3, libxcb1, libxcb-randr0, libxcb-shm0, libxrandr2, libxkbcommon0, libwayland-client0, libegl1, libgbm1, libpipewire-0.3-0
          Maintainer: TamKungZ_
          Description: Lightweight screen recorder
          EOF
          dpkg-deb --build "$DEB_ROOT" "dist/rsecord_${VER}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-linux
          path: |
            dist/rsecord-linux-x86_64.tar.gz
            dist/rsecord_*.deb

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin

      - name: Create app bundle and DMG
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          APP=dist/rsecord.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/rsecord" \
            target/aarch64-apple-darwin/release/rsecord \
            target/x86_64-apple-darwin/release/rsecord
          chmod +x "$APP/Contents/MacOS/rsecord"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>rsecord</string>
            <key>CFBundleDisplayName</key><string>rsecord</string>
            <key>CFBundleIdentifier</key><string>com.tamkungz.rsecord</string>
            <key>CFBundleExecutable</key><string>rsecord</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>rsecord needs microphone access to record audio.</string>
            <key>NSScreenCaptureUsageDescription</key><string>rsecord needs screen recording access to capture your screen.</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"
          mkdir -p dist/dmg
          ditto "$APP" dist/dmg/rsecord.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "rsecord" -srcfolder dist/dmg -ov -format UDZO dist/rsecord-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-macos
          path: dist/rsecord-macos.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Import GPG key and sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          find . -maxdepth 1 -type f ! -name '*.asc' ! -name 'SHA256SUMS' -exec sha256sum {} + | sed 's|\./||g' > SHA256SUMS
          cd ..
          for f in dist/*; do
            if [ -f "$f" ] && [[ "$f" != *.asc ]]; then
              if [ -n "$GPG_PASSPHRASE" ]; then
                echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$f"
              else
                gpg --batch --yes --armor --detach-sign "$f"
              fi
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*