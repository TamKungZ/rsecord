name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and draft a release for (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      core_version: ${{ steps.meta.outputs.core_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version and check tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "::error::Cargo.lock is not committed (required for --locked builds)"; exit 1; }
          VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[]; .name == "rsecord" and (.kind | index("bin")))) | .version' \
            | head -n1)
          if [ -z "$VER" ]; then
            echo "::error::No package with a bin target named 'rsecord' found in Cargo metadata"
            exit 1
          fi
          CORE="${VER%%[-+]*}"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VER" ]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE" >> "$GITHUB_OUTPUT"
          echo "Version: $VER (core $CORE), tag: ${TAG:-<none>}"

      - name: Validate icon assets
        run: |
          python3 - <<'PY'
          import struct, sys, xml.etree.ElementTree as ET

          errors, warnings = [], []

          def read(p):
              try:
                  with open(p, "rb") as f:
                      return f.read()
              except OSError as e:
                  errors.append(f"{p}: cannot read ({e})")
                  return None

          d = read("assets/icon-256.png")
          if d is not None:
              if d[:8] != b"\x89PNG\r\n\x1a\n":
                  errors.append("assets/icon-256.png: not a PNG file")
              else:
                  w, h = struct.unpack(">II", d[16:24])
                  if (w, h) != (256, 256):
                      errors.append(f"assets/icon-256.png: is {w}x{h}, expected 256x256")

          for name in ("icon", "icon-installer"):
              p = f"assets/{name}.ico"
              d = read(p)
              if d is None:
                  continue
              if len(d) < 6 or struct.unpack("<HH", d[:4]) != (0, 1):
                  errors.append(f"{p}: not a valid ICO file")
                  continue
              count = struct.unpack("<H", d[4:6])[0]
              sizes = set()
              for i in range(count):
                  e = d[6 + 16 * i: 6 + 16 * (i + 1)]
                  if len(e) < 16:
                      errors.append(f"{p}: truncated directory")
                      break
                  sizes.add(e[0] or 256)
              print(p, "sizes:", sorted(sizes))
              if 256 not in sizes:
                  errors.append(f"{p}: missing 256x256 image")
              for s in (16, 32, 48):
                  if s not in sizes:
                      errors.append(f"{p}: missing {s}x{s} image (blurry/blank icon in Explorer/taskbar)")

          for name in ("icon", "icon-installer"):
              p = f"assets/{name}.icns"
              d = read(p)
              if d is None:
                  continue
              if d[:4] != b"icns":
                  errors.append(f"{p}: not an ICNS file")
                  continue
              total = struct.unpack(">I", d[4:8])[0]
              if total != len(d):
                  errors.append(f"{p}: header says {total} bytes, file is {len(d)}")
              types, off = [], 8
              while off + 8 <= len(d):
                  t = d[off:off + 4].decode("latin1")
                  n = struct.unpack(">I", d[off + 4:off + 8])[0]
                  if n < 8:
                      break
                  types.append(t)
                  off += n
              print(p, "chunks:", types)
              if not any(t in types for t in ("ic08", "ic09", "ic10", "ic13", "ic14")):
                  errors.append(f"{p}: no 256px+ representation (ic08/ic09/ic10/ic13/ic14)")
              if "ic10" not in types:
                  warnings.append(f"{p}: no 1024px (ic10) image; Retina display will upscale it")

          d = read("assets/icon.svg")
          if d is not None:
              try:
                  root = ET.fromstring(d)
                  if not root.tag.endswith("svg"):
                      errors.append("assets/icon.svg: root element is not <svg>")
              except ET.ParseError as e:
                  errors.append(f"assets/icon.svg: invalid XML ({e})")

          for w in warnings:
              print(f"::warning::{w}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Copy required VC++ runtime DLLs (app-local)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')

          $srcDir = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            $root = Join-Path $vs 'VC\Redist\MSVC'
            if (Test-Path $root) {
              $newest = Get-ChildItem $root -Directory |
                Where-Object { $_.Name -match '^\d+\.\d+' } |
                Sort-Object { [version]$_.Name } -Descending |
                Select-Object -First 1
              if ($newest) {
                $crt = Get-ChildItem (Join-Path $newest.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
                  Select-Object -First 1
                if ($crt) { $srcDir = $crt.FullName }
              }
            }
          }
          if (-not $srcDir) {
            Write-Warning 'VS redist folder not found, falling back to System32'
            $srcDir = Join-Path $env:SystemRoot 'System32'
          }
          Write-Host "VC++ runtime source: $srcDir"

          foreach ($n in $names) {
            $src = Join-Path $srcDir $n
            if (-not (Test-Path $src)) { throw "Required DLL not found: $src" }
            Copy-Item $src -Destination target\release\ -Force
            Write-Host ("  {0}  {1}" -f $n, (Get-Item $src).VersionInfo.FileVersion)
          }

      - name: Install / upgrade Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'ISCC.exe not found' }

      - name: Create installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:APP_VERSION
          $verinfo = "$($env:APP_CORE_VERSION).0"
          $iss = @'
          [Setup]
          AppId={{D8A7B2C1-3E4F-5A6B-7C8D-9E0F1A2B3C4D}
          AppName=rsecord
          AppVersion=@@VER@@
          AppVerName=rsecord @@VER@@
          AppPublisher=TamKungZ_
          AppCopyright=Copyright (C) TamKungZ_
          VersionInfoVersion=@@VERINFO@@
          VersionInfoProductVersion=@@VERINFO@@
          VersionInfoCompany=TamKungZ_
          VersionInfoDescription=rsecord Setup
          VersionInfoProductName=rsecord
          DefaultDirName={autopf}\rsecord
          DefaultGroupName=rsecord
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=rsecord-setup
          SetupIconFile=assets\icon-installer.ico
          WizardStyle=modern
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\rsecord.exe
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog

          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; Flags: unchecked

          [Files]
          Source: "target\release\rsecord.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\vcruntime140.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\vcruntime140_1.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\msvcp140.dll"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\rsecord"; Filename: "{app}\rsecord.exe"
          Name: "{autodesktop}\rsecord"; Filename: "{app}\rsecord.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\rsecord.exe"; Description: "Launch rsecord"; Flags: nowait postinstall skipifsilent

          [InstallDelete]
          Type: files; Name: "{app}\*.dll"
          Type: files; Name: "{app}\rsecord.exe"
          '@
          $iss.Replace('@@VER@@', $ver).Replace('@@VERINFO@@', $verinfo) |
            Set-Content -Path installer.iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist\rsecord-setup.exe)) { throw 'dist\rsecord-setup.exe was not produced' }

      - name: Test installer (silent install + launch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist\rsecord-setup.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'rsecord-test'
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }

          foreach ($f in 'rsecord.exe', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }

          $app = Start-Process -FilePath (Join-Path $dir 'rsecord.exe') -PassThru
          $null = $app.Handle
          Start-Sleep -Seconds 5
          if ($app.HasExited) {
            Write-Host "App exited early with code $($app.ExitCode)"
            if ($app.ExitCode -in @(-1073741515, -1073741701)) {
              throw "Loader error launching rsecord.exe (0x$('{0:X8}' -f $app.ExitCode))"
            }
          } else {
            $app.Kill()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-windows
          path: dist/rsecord-setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang libclang-dev pkg-config ninja-build python3-pip \
            desktop-file-utils \
            libasound2-dev libdbus-1-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgbm-dev
          pip3 install --user meson

      - name: Cache PipeWire
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/pipewire
          key: pipewire-1.4.2-ubuntu-22.04-v1

      - name: Build PipeWire
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 --branch 1.4.2 https://gitlab.freedesktop.org/pipewire/pipewire.git \
            || git clone --depth 1 --branch 1.4.2 https://github.com/PipeWire/pipewire.git
          cd pipewire
          meson setup build --prefix=$HOME/pipewire --libdir=lib --buildtype=release \
            -Dtests=disabled -Dexamples=disabled -Dman=disabled -Ddocs=disabled \
            "-Dsession-managers=[]"
          ninja -C build
          ninja -C build install

      - name: Export PipeWire build environment
        run: |
          echo "PKG_CONFIG_PATH=$HOME/pipewire/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/pipewire/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package tarball
        run: |
          set -euo pipefail
          mkdir -p dist/rsecord
          cp target/release/rsecord dist/rsecord/
          cp assets/icon-256.png dist/rsecord/rsecord.png
          cp assets/icon.svg dist/rsecord/rsecord.svg
          cat > dist/rsecord/rsecord.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=rsecord
          Comment=Lightweight screen recorder
          Exec=rsecord
          Icon=rsecord
          Categories=AudioVideo;Recorder;
          Keywords=screen;record;capture;
          Terminal=false
          EOF
          tar --owner=0 --group=0 --numeric-owner -czf dist/rsecord-linux-x86_64.tar.gz -C dist rsecord

      - name: Build deb
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          VER="${APP_VERSION//-/~}"
          DEB_ROOT=dist/deb-root
          mkdir -p "$DEB_ROOT/DEBIAN" \
                   "$DEB_ROOT/usr/bin" \
                   "$DEB_ROOT/usr/share/applications" \
                   "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$DEB_ROOT/usr/share/icons/hicolor/scalable/apps"
          install -m 0755 target/release/rsecord "$DEB_ROOT/usr/bin/rsecord"
          install -m 0644 assets/icon-256.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/rsecord.png"
          install -m 0644 assets/icon.svg "$DEB_ROOT/usr/share/icons/hicolor/scalable/apps/rsecord.svg"
          cat > "$DEB_ROOT/usr/share/applications/rsecord.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=rsecord
          Comment=Lightweight screen recorder
          Exec=/usr/bin/rsecord
          Icon=rsecord
          Categories=AudioVideo;Recorder;
          Keywords=screen;record;capture;
          Terminal=false
          EOF
          chmod 0644 "$DEB_ROOT/usr/share/applications/rsecord.desktop"
          desktop-file-validate "$DEB_ROOT/usr/share/applications/rsecord.desktop"
          SIZE=$(du -sk "$DEB_ROOT/usr" | cut -f1)
          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: rsecord
          Version: $VER
          Section: video
          Priority: optional
          Architecture: amd64
          Installed-Size: $SIZE
          Depends: libc6 (>= 2.35), libasound2t64 | libasound2, libdbus-1-3, libxcb1, libxcb-randr0, libxcb-shm0, libxrandr2, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxi6, libwayland-client0, libwayland-cursor0, libegl1, libgbm1, libpipewire-0.3-0t64 | libpipewire-0.3-0
          Recommends: libvulkan1, fonts-dejavu-core, xdg-utils
          Maintainer: TamKungZ_ <dev@tamkungz.me>
          Description: Lightweight screen recorder
          EOF
          dpkg-deb --root-owner-group --build "$DEB_ROOT" "dist/rsecord_${VER}_amd64.deb"
          dpkg-deb --info "dist/rsecord_${VER}_amd64.deb"

      - name: Test deb on clean Ubuntu 22.04 and 24.04
        run: |
          set -euo pipefail
          for img in ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$img"
            docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/dist:/dist:ro" "$img" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq /dist/rsecord_*.deb
              out=$(ldd -r /usr/bin/rsecord 2>&1 || true)
              echo "$out"
              if echo "$out" | grep -Eq "not found|undefined symbol"; then
                echo "::error::Unresolved libraries or symbols on this distro"
                exit 1
              fi
              test "$(stat -c %U /usr/bin/rsecord)" = root
              test -f /usr/share/applications/rsecord.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/rsecord.png
            '
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-linux
          path: |
            dist/rsecord-linux-x86_64.tar.gz
            dist/rsecord_*.deb
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Validate icon.icns
        run: |
          iconutil --convert iconset assets/icon.icns --output "$RUNNER_TEMP/icon.iconset"
          iconutil --convert iconset assets/icon-installer.icns --output "$RUNNER_TEMP/icon-installer.iconset"

      - name: Create app bundle and DMG
        env:
          APP_CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
        run: |
          set -euo pipefail
          VER="$APP_CORE_VERSION"
          APP=dist/rsecord.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/rsecord" \
            target/aarch64-apple-darwin/release/rsecord \
            target/x86_64-apple-darwin/release/rsecord
          chmod +x "$APP/Contents/MacOS/rsecord"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>rsecord</string>
            <key>CFBundleDisplayName</key><string>rsecord</string>
            <key>CFBundleIdentifier</key><string>com.tamkungz.rsecord</string>
            <key>CFBundleExecutable</key><string>rsecord</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>Copyright © TamKungZ_</string>
            <key>NSMicrophoneUsageDescription</key><string>rsecord needs microphone access to record audio.</string>
            <key>NSScreenCaptureUsageDescription</key><string>rsecord needs screen recording access to capture your screen.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/rsecord")"
          lipo -archs "$APP/Contents/MacOS/rsecord" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/rsecord" | grep -q arm64

          mkdir -p dist/dmg
          ditto "$APP" dist/dmg/rsecord.app
          ln -s /Applications dist/dmg/Applications
          cp assets/icon-installer.icns dist/dmg/.VolumeIcon.icns
          SetFile -a C dist/dmg
          for i in 1 2 3; do
            if hdiutil create -volname "rsecord" -srcfolder dist/dmg -ov -format UDZO dist/rsecord-macos.dmg; then
              break
            fi
            echo "hdiutil failed (attempt $i), retrying..."
            sleep 5
          done
          test -f dist/rsecord-macos.dmg
          hdiutil verify dist/rsecord-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: rsecord-macos
          path: dist/rsecord-macos.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify expected artifacts
        run: |
          set -euo pipefail
          ls -lh dist/
          for f in rsecord-setup.exe rsecord-linux-x86_64.tar.gz rsecord-macos.dmg; do
            test -s "dist/$f" || { echo "::error::Missing artifact: $f"; exit 1; }
          done
          ls dist/rsecord_*_amd64.deb >/dev/null || { echo "::error::Missing .deb artifact"; exit 1; }

      - name: Checksums and GPG signatures
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name '*.asc' ! -name 'SHA256SUMS' -exec sha256sum {} + | sed 's|\./||g' > SHA256SUMS
          cat SHA256SUMS
          cd ..

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret is not set - release will contain checksums but NO signatures"
            exit 0
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in dist/*; do
            if [ -f "$f" ] && [[ "$f" != *.asc ]]; then
              if [ -n "${GPG_PASSPHRASE:-}" ]; then
                echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$f"
              else
                gpg --batch --yes --armor --detach-sign "$f"
              fi
            fi
          done
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*