[package]
name = "rsecord"
version = "0.3.0"
edition = "2024"
description = "lite cross-platform screen recorder"
authors = ["TamKungZ_"]
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }
tokio = { version = "1", features = ["rt"] }
xcap = "0.9"
cpal = "0.18"
anyhow = "1"
dirs = "7"
openh264 = "0.9"
mp4 = "0.14"
fdk-aac = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true