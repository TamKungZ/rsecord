[package]
name = "rsecord"
version = "0.1.0"
edition = "2024"
description = "lite cross-platform screen recorder"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt"] }
xcap = "0.9"
cpal = "0.18"
hound = "3.5"
anyhow = "1"
dirs = "7"
openh264 = "0.9"
mp4 = "0.14"
fdk-aac = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true